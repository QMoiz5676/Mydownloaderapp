name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip and build
        run: |
          unzip -q "$(ls *.zip | head -n1)" -d proj
          cd "$(dirname "$(find proj -name settings.gradle.kts | head -n1)")"
                    sed -i 's/, "armeabi-v7a"//' app/build.gradle.kts
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/vidora.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vidora-apk
          path: out/vidora.apk
